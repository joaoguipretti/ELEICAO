<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apuração 2026</title>
    <script>
      // Aplica o tema antes de pintar a página (evita piscar branco no tema escuro).
      // Usa a escolha salva; se não houver, segue o tema do sistema.
      (function () {
        var salvo = null;
        try { salvo = localStorage.getItem('tema'); } catch (e) {}
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = salvo || (escuro ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

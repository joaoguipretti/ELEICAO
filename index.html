<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="description" content="Apuração das Eleições 2026 em tempo real, com dados oficiais do TSE." />
    <title>Apuração 2026</title>
    <script>
      // Aplica o tema antes de pintar (evita piscar): escolha salva ou o tema do sistema.
      (function () {
        var salvo = null;
        try { salvo = localStorage.getItem('tema'); } catch (e) {}
        var claro = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = salvo || (claro ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
